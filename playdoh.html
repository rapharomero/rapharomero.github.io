<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#EDE7DD;
    --ink-dim:#8C8578;
    --panel:rgba(24,26,25,0.72);
    --line:rgba(237,231,221,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:#15100F;}
  body{
    font-family:'DM Mono', ui-monospace, monospace;
    color:var(--ink);
    -webkit-user-select:none; user-select:none;
    touch-action:none;
  }
  #bg{
    position:fixed; inset:0;
    background:
      radial-gradient(120% 90% at 50% 30%, #2A2523 0%, #191514 55%, #0E0B0A 100%);
  }
  canvas{position:fixed; inset:0; display:block;}

  .panel{
    position:fixed; z-index:5;
    background:var(--panel);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);
    border-radius:14px;
  }

  /* modes — bottom centre */
  #modes{
    left:50%; transform:translateX(-50%); bottom:22px;
    display:flex; gap:4px; padding:4px;
  }
  #modes button{
    font:inherit; font-size:12px; letter-spacing:0.04em;
    color:var(--ink-dim); background:none; border:0; cursor:pointer;
    padding:8px 16px; border-radius:10px; transition:background .18s, color .18s;
  }
  #modes button:hover{color:var(--ink);}
  #modes button[aria-pressed="true"]{background:rgba(237,231,221,0.12); color:var(--ink);}
  #modes button:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}

  /* sliders — top left */
  #dials{
    top:22px; left:22px; padding:16px 18px 14px;
    display:grid; gap:13px; width:212px;
  }
  .dial{display:grid; gap:6px;}
  .dial .row{display:flex; justify-content:space-between; font-size:11px; letter-spacing:0.06em; color:var(--ink-dim);}
  .dial .val{color:var(--ink);}
  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:100%; height:2px; background:rgba(237,231,221,0.22); border-radius:2px; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:var(--ink); border:0; cursor:grab;
  }
  input[type=range]::-moz-range-thumb{
    width:13px; height:13px; border-radius:50%; background:var(--ink); border:0; cursor:grab;
  }
  input[type=range]:focus-visible{outline:2px solid var(--ink); outline-offset:6px;}

  #swatches{display:flex; gap:7px; padding-top:2px;}
  #swatches button{
    width:20px; height:20px; border-radius:50%; border:1px solid rgba(0,0,0,0.35);
    cursor:pointer; padding:0; transition:transform .15s;
  }
  #swatches button:hover{transform:scale(1.14);}
  #swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink);}

  /* hints — top right */
  #hints{
    top:22px; right:22px; padding:14px 16px;
    font-size:11px; line-height:1.85; letter-spacing:0.04em; color:var(--ink-dim);
    text-align:right;
  }
  #hints b{color:var(--ink); font-weight:500;}

  #reset{
    position:fixed; z-index:5; right:22px; bottom:22px;
    font:inherit; font-size:12px; letter-spacing:0.04em;
    color:var(--ink-dim); background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:9px 15px; cursor:pointer;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  }
  #reset:hover{color:var(--ink);}

  #loading{
    position:fixed; inset:0; display:grid; place-items:center;
    font-size:12px; letter-spacing:0.14em; color:var(--ink-dim);
  }

  @media (max-width:640px){
    #dials{width:170px; top:14px; left:14px; padding:13px 14px 11px;}
    #hints{display:none;}
    #modes{bottom:14px;}
    #reset{bottom:14px; right:14px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div id="bg"></div>
<div id="loading">kneading…</div>

<div class="panel" id="dials" hidden>
  <div class="dial">
    <div class="row"><label for="melt">melt</label><span class="val" id="meltVal">slow</span></div>
    <input id="melt" type="range" min="0" max="100" value="42" aria-describedby="meltVal">
  </div>
  <div class="dial">
    <div class="row"><label for="brush">brush</label><span class="val" id="brushVal">medium</span></div>
    <input id="brush" type="range" min="10" max="100" value="42">
  </div>
  <div class="dial">
    <div class="row"><label for="smooth">smoothing</label><span class="val" id="smoothVal">25</span></div>
    <input id="smooth" type="range" min="0" max="60" value="25">
  </div>
  <div id="swatches" role="group" aria-label="dough colour"></div>
</div>

<div class="panel" id="hints" hidden>
  <div><b>drag</b> — current mode</div>
  <div><b>right-drag</b> — orbit</div>
  <div><b>middle-drag</b> — move</div>
  <div><b>scroll</b> — zoom</div>
</div>

<div class="panel" id="modes" role="group" aria-label="drag mode" hidden>
  <button data-mode="sculpt" aria-pressed="true">sculpt</button>
  <button data-mode="move" aria-pressed="false">move</button>
  <button data-mode="orbit" aria-pressed="false">orbit</button>
</div>

<button id="reset" hidden>reset</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const loading = document.getElementById('loading');
  if (typeof THREE === 'undefined'){
    loading.textContent = 'could not load the 3D library — check your connection';
    return;
  }
  loading.remove();
  ['dials','hints','modes','reset'].forEach(id => document.getElementById(id).hidden = false);

  // ---------- scene ----------
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
  let camRadius = 4.6, camTheta = 0.6, camPhi = 1.25;
  function updateCam(){
    camera.position.set(
      camRadius*Math.sin(camPhi)*Math.sin(camTheta),
      camRadius*Math.cos(camPhi),
      camRadius*Math.sin(camPhi)*Math.cos(camTheta));
    camera.lookAt(0,0,0);
  }
  updateCam();

  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);
  renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  scene.add(new THREE.AmbientLight(0xffffff, 0.45));
  const key = new THREE.DirectionalLight(0xfff4e8, 0.85); key.position.set(3,5,4); scene.add(key);
  const rim = new THREE.DirectionalLight(0xa9c6ff, 0.55); rim.position.set(-4,-1,-3); scene.add(rim);
  const fill = new THREE.DirectionalLight(0xffd9b0, 0.28); fill.position.set(0,-4,2); scene.add(fill);

  // ---------- welded sphere ----------
  const R = 1.2;
  const raw = new THREE.IcosahedronGeometry(R, 5).attributes.position.array;
  const map = new Map(); const verts = []; const index = [];
  for (let i = 0; i < raw.length; i += 3){
    const k = raw[i].toFixed(4)+'|'+raw[i+1].toFixed(4)+'|'+raw[i+2].toFixed(4);
    let id = map.get(k);
    if (id === undefined){ id = verts.length/3; map.set(k, id); verts.push(raw[i], raw[i+1], raw[i+2]); }
    index.push(id);
  }
  const geo = new THREE.BufferGeometry();
  const posAttr = new THREE.BufferAttribute(new Float32Array(verts), 3);
  geo.setAttribute('position', posAttr);
  geo.setIndex(index);
  const count = posAttr.count;
  const rest = new Float32Array(posAttr.array);

  // neighbour table for Laplacian smoothing
  const sets = Array.from({length:count}, () => new Set());
  for (let t = 0; t < index.length; t += 3){
    const a = index[t], b = index[t+1], c = index[t+2];
    sets[a].add(b); sets[a].add(c);
    sets[b].add(a); sets[b].add(c);
    sets[c].add(a); sets[c].add(b);
  }
  const nbStart = new Uint32Array(count+1);
  let tot = 0;
  for (let i = 0; i < count; i++){ nbStart[i] = tot; tot += sets[i].size; }
  nbStart[count] = tot;
  const nbList = new Uint32Array(tot);
  let w = 0;
  for (let i = 0; i < count; i++) for (const n of sets[i]) nbList[w++] = n;
  const scratch = new Float32Array(count*3);

  const mat = new THREE.MeshStandardMaterial({color:0xE0654F, roughness:0.72, metalness:0.0});
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);
  geo.computeVertexNormals();
  geo.computeBoundingSphere();

  // ---------- controls ----------
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const grabLocal = new THREE.Vector3();
  const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();

  let uiMode = 'sculpt';       // what left-drag does
  let active = null;           // what the current drag is doing
  let last = {x:0, y:0};
  let brushR = 0.42, meltRate = 0.006, lambda = 0.25;
  let dirty = true;

  const meltEl = document.getElementById('melt');
  const brushEl = document.getElementById('brush');
  const smoothEl = document.getElementById('smooth');
  const meltVal = document.getElementById('meltVal');
  const brushVal = document.getElementById('brushVal');
  const smoothVal = document.getElementById('smoothVal');

  // wide, exponential range: from "keeps its shape indefinitely" to "snaps back instantly"
  function applyMelt(){
    const t = Number(meltEl.value)/100;
    meltRate = t === 0 ? 0 : 0.00004 * Math.pow(4000, t);
    meltVal.textContent =
      t === 0 ? 'never' :
      meltRate < 0.0004 ? 'glacial' :
      meltRate < 0.002  ? 'very slow' :
      meltRate < 0.012  ? 'slow' :
      meltRate < 0.05   ? 'quick' : 'snap';
    dirty = true;
  }
  function applyBrush(){
    brushR = Number(brushEl.value)/100;
    brushVal.textContent = brushR < 0.3 ? 'fine' : brushR < 0.6 ? 'medium' : 'broad';
  }
  function applySmooth(){
    lambda = Number(smoothEl.value)/100;
    smoothVal.textContent = smoothEl.value;
    dirty = true;
  }
  meltEl.addEventListener('input', applyMelt);
  brushEl.addEventListener('input', applyBrush);
  smoothEl.addEventListener('input', applySmooth);
  applyMelt(); applyBrush(); applySmooth();

  // dough colours
  const colours = [
    ['#E0654F','coral'], ['#F0B429','yellow'], ['#4FA98C','green'],
    ['#5B7FD4','blue'], ['#D98BB8','pink'], ['#EDE7DD','white']
  ];
  const sw = document.getElementById('swatches');
  colours.forEach(([hex,name], i) => {
    const b = document.createElement('button');
    b.style.background = hex;
    b.title = name;
    b.setAttribute('aria-label', name);
    b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
    b.addEventListener('click', () => {
      mat.color.set(hex);
      [...sw.children].forEach(c => c.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true');
    });
    sw.appendChild(b);
  });

  const modeBtns = [...document.querySelectorAll('#modes button')];
  modeBtns.forEach(b => b.addEventListener('click', () => {
    uiMode = b.dataset.mode;
    modeBtns.forEach(o => o.setAttribute('aria-pressed', String(o === b)));
  }));

  document.getElementById('reset').addEventListener('click', () => {
    posAttr.array.set(rest);
    posAttr.needsUpdate = true;
    mesh.position.set(0,0,0);
    dirty = true;
  });

  function toNDC(e){
    ndc.x = (e.clientX/innerWidth)*2 - 1;
    ndc.y = -(e.clientY/innerHeight)*2 + 1;
  }
  // screen-space axes of the *current* view, in world space
  function viewAxes(){
    return {
      right: new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0),
      up: new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1)
    };
  }

  renderer.domElement.addEventListener('pointerdown', e => {
    renderer.domElement.setPointerCapture(e.pointerId);
    last = {x:e.clientX, y:e.clientY};
    if (e.button === 2){ active = 'orbit'; return; }
    if (e.button === 1){ active = 'move'; e.preventDefault(); return; }

    if (uiMode === 'sculpt'){
      toNDC(e);
      raycaster.setFromCamera(ndc, camera);
      const hit = raycaster.intersectObject(mesh)[0];
      if (hit){
        grabLocal.copy(mesh.worldToLocal(hit.point.clone()));
        active = 'sculpt';
      } else {
        active = 'move';   // clicking empty space and dragging carries the ball along
      }
    } else {
      active = uiMode;
    }
  });
  addEventListener('pointerup', () => { active = null; });
  addEventListener('pointercancel', () => { active = null; });

  addEventListener('pointermove', e => {
    if (!active) return;
    const dx = e.clientX - last.x, dy = e.clientY - last.y;
    last = {x:e.clientX, y:e.clientY};

    if (active === 'orbit'){
      camTheta -= dx*0.008;
      camPhi = Math.max(0.15, Math.min(Math.PI-0.15, camPhi - dy*0.008));
      updateCam();
      dirty = true;
      return;
    }

    const {right, up} = viewAxes();

    if (active === 'move'){
      // world units per pixel at the ball's depth, so it tracks the cursor 1:1
      const s = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov)/2) * camRadius / innerHeight;
      mesh.position.addScaledVector(right, dx*s).addScaledVector(up, -dy*s);
      dirty = true;
      return;
    }

    // sculpt — push along the view's own right/up axes
    const s = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov)/2) * camRadius / innerHeight;
    tmpA.copy(mesh.position); // reuse as scratch below
    const worldPoint = mesh.localToWorld(tmpB.copy(grabLocal));
    const movedWorld = worldPoint.clone().addScaledVector(right, dx*s).addScaledVector(up, -dy*s);
    const movedLocal = mesh.worldToLocal(movedWorld);
    const mx = movedLocal.x - grabLocal.x,
          my = movedLocal.y - grabLocal.y,
          mz = movedLocal.z - grabLocal.z;

    const arr = posAttr.array, br2 = brushR*brushR;
    for (let i = 0; i < count; i++){
      const ix = i*3;
      const ax = arr[ix]-grabLocal.x, ay = arr[ix+1]-grabLocal.y, az = arr[ix+2]-grabLocal.z;
      const d2 = ax*ax + ay*ay + az*az;
      if (d2 < br2){
        let f = 1 - d2/br2;
        f = f*f*(3-2*f);
        arr[ix]   += mx*f;
        arr[ix+1] += my*f;
        arr[ix+2] += mz*f;
      }
    }
    grabLocal.set(movedLocal.x, movedLocal.y, movedLocal.z);
    posAttr.needsUpdate = true;
    dirty = true;
  });

  renderer.domElement.addEventListener('wheel', e => {
    e.preventDefault();
    camRadius = Math.max(2.0, Math.min(12, camRadius + e.deltaY*0.0025));
    updateCam();
    dirty = true;
  }, {passive:false});

  // ---------- relaxation ----------
  function laplacian(l){
    if (l <= 0) return;
    const arr = posAttr.array;
    for (let i = 0; i < count; i++){
      let sx=0, sy=0, sz=0;
      const s0 = nbStart[i], s1 = nbStart[i+1], n = s1-s0;
      for (let j = s0; j < s1; j++){
        const ix = nbList[j]*3;
        sx += arr[ix]; sy += arr[ix+1]; sz += arr[ix+2];
      }
      const ix = i*3;
      scratch[ix]   = arr[ix]   + (sx/n - arr[ix])*l;
      scratch[ix+1] = arr[ix+1] + (sy/n - arr[ix+1])*l;
      scratch[ix+2] = arr[ix+2] + (sz/n - arr[ix+2])*l;
    }
    arr.set(scratch);
    posAttr.needsUpdate = true;
  }

  function melt(){
    if (meltRate <= 0) return 1;
    const arr = posAttr.array, k = meltRate;
    let maxd = 0;
    for (let i = 0; i < count*3; i++){
      const d = rest[i] - arr[i];
      arr[i] += d*k;
      const ad = d < 0 ? -d : d;
      if (ad > maxd) maxd = ad;
    }
    posAttr.needsUpdate = true;
    return maxd;
  }

  function frame(){
    const sculpting = active === 'sculpt';
    if (dirty || sculpting){
      laplacian(lambda*0.5);
      let residual = 1;
      if (!sculpting) residual = melt();
      geo.computeVertexNormals();
      geo.computeBoundingSphere();
      renderer.render(scene, camera);
      // once it has settled back to a ball, stop burning frames until touched again
      if (!sculpting && residual < 0.0004 && lambda === 0) dirty = false;
    } else {
      renderer.render(scene, camera);
    }
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
